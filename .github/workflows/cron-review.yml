name: Trigger Daily Market Review

on:
  schedule:
    - cron: '0 0 * * *' # Каждый день в 00:00 UTC
  workflow_dispatch: # Позволяет запускать вручную для теста

jobs:
  generate:
    runs-on: ubuntu-latest
    
    # ⚠️ ВАЖНО: Даем права на запись в репозиторий для GitHub Actions
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run generation script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: node netlify/functions/generate-seo.js

      - name: Commit and push updated review file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_market_review.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update latest market review [skip ci]" && git push)