import axios from "axios";
import fs from "fs";
import path from "path";
import { getStore } from "@netlify/blobs";
import { submitToGoogleIndex } from '../../src/utils/indexer.js';

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const trendStoreName = "trending-topics";
const trendStoreKey = "latest";
const trendFilePath = path.join(process.cwd(), "data", "latest_trending_topic.json");

function getTrendStore(required = false) {
  const siteID = process.env.NETLIFY_SITE_ID;
  const token = process.env.NETLIFY_AUTH_TOKEN;
  const hasNetlifyContext = Boolean(
    process.env.NETLIFY_BLOBS_CONTEXT || globalThis.netlifyBlobsContext
  );

  if (siteID && token) {
    return getStore({ name: trendStoreName, siteID, token });
  }

  if (hasNetlifyContext) {
    return getStore(trendStoreName);
  }

  if (required) {
    throw new Error("NETLIFY_SITE_ID and NETLIFY_AUTH_TOKEN are required to save the trend to Netlify Blobs");
  }

  return null;
}

async function saveTopic(topic, store) {
  // 1. Сохраняем в Netlify Blobs (если стор доступен)
  if (store) {
    await store.setJSON('latest', topic);
    await store.setJSON(`history/${topic.date}`, topic);
    console.log('Тема дня успешно сохранена в Netlify Blobs.');
  }

  // 2. Дополнительно всегда сохраняем локально, чтобы файл обновлялся в репозитории
  try {
    if (!fs.existsSync(path.dirname(trendFilePath))) {
      fs.mkdirSync(path.dirname(trendFilePath), { recursive: true });
    }
    fs.writeFileSync(trendFilePath, JSON.stringify(topic, null, 2), 'utf8');
    console.log(`Тема дня сохранена локально в ${trendFilePath}.`);
  } catch (localErr) {
    console.warn("Не удалось сохранить локальный файл темы:", localErr.message);
  }

  // Добавляем в sitemap и пингуем Google Indexing API
  await submitToGoogleIndex(`trending/${topic.date}`);
}

async function runGeneration(store = getTrendStore()) {
  console.log("Поиск трендовой криптовалюты...");

  let selectedTicker = "BTC";
  let priceChange = "+3.5%";
  let marketSummary = "Bitcoin is showing strong momentum with key technical levels in focus.";

  try {
    const marketRes = await axios.get("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true");
    const data = marketRes.data;
    
    // Выбираем монету с наибольшим изменением за 24 часа для тренда
    const coins = [
      { name: "BTC", change: data?.bitcoin?.usd_24h_change || 0 },
      { name: "ETH", change: data?.ethereum?.usd_24h_change || 0 },
      { name: "SOL", change: data?.solana?.usd_24h_change || 0 }
    ];
    coins.sort((a, b) => Math.abs(b.change) - Math.abs(a.change));

    if (coins.length > 0) {
      selectedTicker = coins[0].name;
      priceChange = `${coins[0].change >= ? '+' : ''}${coins[0].change.toFixed(2)}%`;
      marketSummary = `${selectedTicker} is experiencing high volatility with a 24-hour change of ${priceChange}.`;
    }
  } catch (err) {
    console.warn("Не удалось получить данные CoinGecko, используем фолбэк:", err.message);
  }

  const openRouterApiKey = process.env.OPENROUTER_API_KEY;
  if (!openRouterApiKey) {
    throw new Error("OpenRouter API key is missing");
  }

  console.log(`Генерация материала для трендовой монеты: ${selectedTicker}...`);

  const englishPrompt = `
Write a detailed, analytical article explaining why ${selectedTicker} is currently trending in the crypto market.
Incorporate these exact real-time parameters at the very beginning: ${marketSummary}

Include:
- Comprehensive analysis of current trends, volume, and price action.
- Key support and resistance levels.
CRITICAL FORMATTING RULE: DO NOT use any <h2>, <h1> or titles at the beginning. Start directly with the first paragraph using a <p> tag. Make it rich, analytical, and professional.
Output ONLY raw HTML content without markdown formatting blocks like \`\`\`html.
  `;

  let englishContent = "";
  try {
    const responseEn = await axios.post(
      "https://openrouter.ai/api/v1/chat/completions",
      {
        model: "openrouter/free",
        messages: [
          { role: "system", content: "You are a professional crypto journalist. Output ONLY raw HTML starting directly with <p>." },
          { role: "user", content: englishPrompt }
        ],
        temperature: 0.4,
        max_tokens: 3000
      },
      {
        headers: {
          "Authorization": `Bearer ${openRouterApiKey}`,
          "Content-Type": "application/json",
          "HTTP-Referer": "http://localhost:8888",
          "X-Title": "CryptoStatix PRO"
        }
      }
    );

    const choice = responseEn.data?.choices?.[0];
    englishContent = choice?.message?.content || choice?.text || "";
    englishContent = englishContent.replace(/```html/g, "").replace(/```/g, "").trim();

    if (!englishContent) {
      englishContent = `<p>At present, ${selectedTicker} is drawing significant market attention as volume surges and traders react to crucial technical benchmarks.</p>`;
    }
  } catch (err) {
    console.error("Ошибка при генерации английской версии тренда:", err.message);
    throw err;
  }

  await sleep(5000);

  // Перевод на русский
  let russianContent = "";
  try {
    const responseRu = await axios.post(
      "https://openrouter.ai/api/v1/chat/completions",
      {
        model: "openrouter/free",
        messages: [
          { role: "system", content: "You are a professional translator. Translate the provided English text into professional Russian. Output ONLY the translated HTML string. Do NOT include markdown code blocks." },
          { role: "user", content: englishContent }
        ],
        temperature: 0.2,
        max_tokens: 4000
      },
      {
        headers: {
          "Authorization": `Bearer ${openRouterApiKey}`,
          "Content-Type": "application/json",
          "HTTP-Referer": "http://localhost:8888",
          "X-Title": "CryptoStatix PRO"
        }
      }
    );
    russianContent = responseRu.data?.choices?.[0]?.message?.content || "";
    russianContent = russianContent.replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/```html/gi, "").replace(/```/g, "").trim();
  } catch (err) {
    console.warn("Ошибка перевода тренда на русский, используем английский:", err.message);
    russianContent = englishContent;
  }

  await sleep(5000);

  // Перевод на украинский
  let ukrainianContent = "";
  try {
    const responseUa = await axios.post(
      "https://openrouter.ai/api/v1/chat/completions",
      {
        model: "openrouter/free",
        messages: [
          { role: "system", content: "You are a professional crypto translator. Translate the provided Russian text into professional Ukrainian. Output ONLY the translated HTML string. Do NOT include markdown code blocks." },
          { role: "user", content: russianContent }
        ],
        temperature: 0.2,
        max_tokens: 4000
      },
      {
        headers: {
          "Authorization": `Bearer ${openRouterApiKey}`,
          "Content-Type": "application/json",
          "HTTP-Referer": "http://localhost:8888",
          "X-Title": "CryptoStatix PRO"
        }
      }
    );
    ukrainianContent = responseUa.data?.choices?.[0]?.message?.content || "";
    ukrainianContent = ukrainianContent.replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/```html/gi, "").replace(/```/g, "").trim();
  } catch (err) {
    console.warn("Ошибка перевода тренда на украинский, используем английский:", err.message);
    ukrainianContent = englishContent;
  }

  const currentDate = new Date().toISOString().split('T')[0];
  const finalPayload = {
    ticker: selectedTicker,
    price_change: priceChange,
    date: currentDate,
    timestamp: new Date().toISOString(),
    translations: {
      en: {
        title: `Why ${selectedTicker} is Trending: Metrics & Market Analysis`,
        meta_description: `Explore why ${selectedTicker} is gaining momentum. Swappy AI analyzes key volume, RSI, and market trends on CryptoStatix PRO.`,
        content: englishContent
      },
      ru: {
        title: `Почему растет ${selectedTicker}: Анализ метрик и рыночного тренда`,
        meta_description: `Разбор причин роста ${selectedTicker}. ИИ проанализировал объемы, RSI сигналы и тренды на платформе CryptoStatix.`,
        content: russianContent
      },
      ua: {
        title: `Чому зростає ${selectedTicker}: Аналіз метрик та ринкового тренду`,
        meta_description: `Огляд причин руху ${selectedTicker}. ШІ проанализував обсяги, RSI сигнали та тренди на CryptoStatix PRO.`,
        content: ukrainianContent
      }
    }
  };

  await saveTopic(finalPayload, store);
  return finalPayload;
}

export default async (req, context) => {
  try {
    const store = getTrendStore();
    let topicData = await store?.get("latest", { type: "json" }) || {};
    
    // Если запуск ручной через CLI GitHub Actions
    if (process.argv[1] && process.argv[1].endsWith('daily-trend.js')) {
      topicData = await runGeneration(getTrendStore(true));
    }

    return new Response(JSON.stringify({ success: true, data: topicData }), {
      status: 200,
      headers: { "Content-Type": "application/json" }
    });
  } catch (error) {
    console.error("Ошибка в daily-trend функции:", error);
    return new Response(JSON.stringify({ success: false, error: error.message }), {
      status: 500,
      headers: { "Content-Type": "application/json" }
    });
  }
};

if (process.argv[1] && process.argv[1].endsWith('daily-trend.js')) {
  runGeneration(getTrendStore(true))
    .then(() => process.exit(0))
    .catch((err) => {
      console.error("Ошибка при генерации тренда из CLI:", err);
      process.exit(1);
    });
}